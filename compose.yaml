services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: quarkus-schema-per-tenant-postgres

    environment:
      POSTGRES_USER: quarkus
      POSTGRES_PASSWORD: quarkus
      POSTGRES_DB: multitenant

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quarkus -d multitenant"]
      interval: 5s
      timeout: 5s
      retries: 10